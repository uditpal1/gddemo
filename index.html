<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SSC GD Mock Test</title><link rel="stylesheet" href="css/style.css"></head><body><main>
<section id="s-home"><div class="hero"><h1>SSC GD Mock Test</h1><p>Practice SSC GD with full-length and subject-wise mock tests, detailed results and performance tracking.</p><button class="btn" data-go="login">Login</button><button class="btn out" data-go="register">Register</button></div>
<div class="grid"><div class="stat"><b>80</b><span>Questions</span></div><div class="stat"><b>160</b><span>Marks</span></div><div class="stat"><b>60</b><span>Minutes</span></div><div class="stat"><b>15 min</b><span>Sectional Timer</span></div><div class="stat"><b>Detailed</b><span>Performance</span></div><div class="stat"><b>Live</b><span>Scoreboard</span></div></div></section>
<section id="s-login" hidden><div class="form card"><h2>Login</h2><label class="field">Mobile Number<input id="l-mobile" type="tel" autocomplete="off"></label><label class="field">Password<input id="l-pass" type="password" autocomplete="off"></label><button id="l-btn" class="btn" style="width:100%">Login</button><button class="btn out" style="width:100%" data-go="register">Create Account</button></div></section>
<section id="s-register" hidden><div class="form card"><h2>Register</h2><label class="field">Full Name<input id="r-name" type="text" autocomplete="off"></label><label class="field">Mobile Number<input id="r-mobile" type="tel" autocomplete="off"></label><label class="field">Email (optional)<input id="r-email" type="email" autocomplete="off"></label><label class="field">Password<input id="r-pass" type="password" autocomplete="off"></label><label class="field">Confirm Password<input id="r-pass2" type="password" autocomplete="off"></label><label class="field">Referral Code (optional)<input id="r-ref" type="text" autocomplete="off"></label><button id="r-btn" class="btn" style="width:100%">Create Account</button><button class="btn out" style="width:100%" data-go="login">Back to Login</button></div></section>
<section id="s-dashboard" hidden></section><section id="s-full-tests" hidden></section><section id="s-subject-tests" hidden></section><section id="s-active-test" hidden></section><section id="s-result" hidden></section><section id="s-review" hidden></section><section id="s-performance" hidden></section><section id="s-scoreboard" hidden></section><section id="s-profile" hidden></section><section id="s-premium" hidden></section></main>
<nav class="bottom" aria-label="Main"><button data-nav="dashboard"><span aria-hidden="true">🏠</span>Home</button><button data-nav="tests"><span aria-hidden="true">📝</span>Tests</button><button data-nav="performance"><span aria-hidden="true">📊</span>Performance</button><button data-nav="scoreboard"><span aria-hidden="true">🏆</span>Scoreboard</button><button data-nav="profile"><span aria-hidden="true">👤</span>Profile</button></nav>
<div id="modal" hidden></div><div id="toast" hidden role="status"></div><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/test-engine.js"></script><script src="js/app.js"></script></body></html>
